# Every push to main: run the end-to-end tests against a throwaway Postgres, then migrate Supabase,
# build the site and deploy the Worker to lbscafe.com, then smoke-test the live site.
# Repo secrets: CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers template), DATABASE_URL (Supabase Session pooler).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: fd6453a62e56d7e096d9a41cf0df6ed7

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lbs_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - name: Install
        run: npm ci --prefix api && npm ci --prefix web
      - name: Typecheck API
        run: npm run build --prefix api
      - name: End-to-end tests
        run: npm test --prefix api
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/lbs_test
          DATABASE_SSL: disable
      - name: Build site
        run: npm run build --prefix web

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://lbscafe.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - name: Install
        run: npm ci --prefix api && npm ci --prefix web
      - name: Migrate Supabase
        run: npm run migrate --prefix api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Build site
        run: npm run build --prefix web
      - name: Deploy Worker
        working-directory: api
        run: |
          npx wrangler deploy | tee deploy.log
          echo "VERSION=$(sed -n 's/.*Current Version ID: \([0-9a-f-]*\).*/\1/p' deploy.log)" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Wait for the new version to go live
        # Cloudflare takes a few seconds to roll a new version out; smoke-test only once it answers.
        run: |
          test -n "$VERSION" || { echo "No version ID in the deploy output"; exit 1; }
          for _ in $(seq 1 30); do
            live=$(curl -s https://lbscafe.com/health | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
            [ "$live" = "$VERSION" ] && { echo "Version $VERSION is live"; exit 0; }
            sleep 5
          done
          echo "Version $VERSION still not live after 150 s (live: $live)"; exit 1
      - name: Smoke test lbscafe.com
        # Without a login it only reads, plus one order-pricing check that saves nothing.
        working-directory: api
        run: BASE=https://lbscafe.com npx tsx scripts/smoke.ts
